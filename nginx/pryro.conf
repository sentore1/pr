# =====================================================
# Nginx config for Pryro CMS on Contabo VPS
# Place at: /etc/nginx/sites-available/pryro
# Then: ln -s /etc/nginx/sites-available/pryro /etc/nginx/sites-enabled/
# =====================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Allow Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL — issued by Certbot / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options          "SAMEORIGIN"   always;
    add_header X-Content-Type-Options   "nosniff"      always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Static files — served directly by nginx (Next.js _next/static)
    location /_next/static/ {
        alias /var/www/pryro/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded media files
    location /uploads/ {
        alias /var/www/pryro/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Other public static files
    location /public/ {
        alias /var/www/pryro/public/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy everything else to Next.js (PM2 on port 3000)
    location / {
        proxy_pass          http://127.0.0.1:3000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        'upgrade';
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_cache_bypass  $http_upgrade;
        proxy_read_timeout  60s;
        proxy_connect_timeout 60s;
    }

    # Max upload size (for media library)
    client_max_body_size 20M;

    # Logging
    access_log /var/log/nginx/pryro-access.log;
    error_log  /var/log/nginx/pryro-error.log;
}
